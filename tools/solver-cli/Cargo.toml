[package]
name = "solver-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", default-features = false, features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
anyhow = "1"
